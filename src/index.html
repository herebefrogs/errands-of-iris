<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1">
<meta name="monetization" content="$ilp.uphold.com/2kD7NjJBDjBb">
<style>
  body {
    margin: 0;
    text-align: center;
    background: #000;
  }
  canvas, body {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    image-rendering: pixelated;   /* canvas has no CSS size, so a hi-DPR screen upscales the bitmap - keep that upscale hard-edged, not the browser's default blur */
  }
</style>
<body>
  <canvas id=c></canvas>
  <!-- Dubois-matrix red/cyan anaglyph filters (see DESIGN.md "anaglyph red/cyan
       mode"), referenced from game.js via ctx.filter = 'url(#anaglyphLeft/Right)'.
       color-interpolation-filters=sRGB matters: SVG filters default to linearRGB,
       which would relinearize these matrices (fit for gamma-encoded sRGB input)
       and shift the colors. -->
  <svg style="position:absolute;width:0;height:0">
    <filter id="anaglyphLeft" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0.437  0.449  0.164  0 0
        -0.062 -0.062 -0.024 0 0
        -0.048 -0.050 -0.017 0 0
        0      0      0      1 0" />
    </filter>
    <filter id="anaglyphRight" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        -0.011 -0.032 -0.007 0 0
        0.377  0.761  0.009  0 0
        -0.026 -0.093 1.234  0 0
        0      0      0      1 0" />
    </filter>
  </svg>
  <script src=game.js></script>
</body>
